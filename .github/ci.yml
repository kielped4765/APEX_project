name: APEX CI/CD Pipeline

# Trigger the workflow on pushes to main and pull requests targeting main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment (Python 3.11 for FastAPI and ML components)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install Python dependencies (FastAPI, TestClient, Pytest, ML libraries)
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      # Step 4: Install C++ Build Tools & Dependencies (CMake, GCC, Make)
      - name: Install C++ Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev

      # Step 5: Build the C++ Flight Engine and OpenSSL Broker
      - name: Build C++ Components
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      # Step 6: Run Automated Backend & API Tests via Pytest
      - name: Run Backend Tests
        run: |
          pytest tests/ -v --cov=apex_backend --cov-report=xml

      # Step 7: Optional - Upload Code Coverage to Codecov
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false